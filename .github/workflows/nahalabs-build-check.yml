name: GrowChief build check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "nahalabs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Create non-secret build environment
        run: |
          cp .env.example .env
          echo 'DATABASE_URL=postgresql://build:build@127.0.0.1:5432/build' >> .env
          echo 'AUTH_SECRET=ci-only-not-for-production' >> .env
          echo 'TEMPORAL_ADDRESS=127.0.0.1:7233' >> .env
          echo 'TEMPORAL_NAMESPACE=default' >> .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm dlx prisma@6.13.0 validate --schema ./schema.prisma

      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build
